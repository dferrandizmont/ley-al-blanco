name: apto_armas
description: "Ley al Blanco: preparación sin conexión del examen teórico de la licencia de armas D, E y AEM."
# Never published to pub.dev.
publish_to: 'none'

# version: build-name+build-number (Android versionName/versionCode, iOS
# CFBundleShortVersionString/CFBundleVersion).
version: 0.9.4+19

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^18.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # Ajustes > Tus datos: guardar / abrir el archivo de progreso con los dialogos del
  # sistema (SAF en Android, selector de documentos en iOS): sin permisos de almacenamiento.
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # tool/qa + integration_test/: end-to-end battery on an emulator (docs/qa.md).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  # Public Sans (SIL OFL 1.1, see assets/fonts/PublicSans-OFL.txt). One
  # variable file: the weight comes from the `wght` axis (see
  # AptoTypography); no runtime fetching.
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf

  assets:
    - assets/content/armas/GC-2020-11/
    - assets/fonts/PublicSans-OFL.txt

# Launcher icon: progress ring (80 % = 16/20) around a shield-check, rendered
# from AppMarkPainter by test/branding/render_icons_test.dart (see README in
# that file). Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#2F5D50"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png
  # The PNGs already include the adaptive safe zone (ring = 66 % of the canvas).
  adaptive_icon_foreground_inset: 0

# Native splash: sand (light) / dark green-black (dark) with the centred mark
# tile. No branding image. Regenerate: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#EFE9DD"
  image: assets/branding/splash_mark.png
  color_dark: "#141A17"
  image_dark: assets/branding/splash_mark.png
  android_12:
    color: "#EFE9DD"
    image: assets/branding/splash_mark_android12.png
    icon_background_color: "#2F5D50"
    color_dark: "#141A17"
    image_dark: assets/branding/splash_mark_android12.png
    icon_background_color_dark: "#2F5D50"
