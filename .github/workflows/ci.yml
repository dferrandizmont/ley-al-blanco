name: ci

# Las versiones se compilan, prueban y firman en local (tool/publish/release.sh);
# la CI solo comprueba. El repositorio público (exportación) la pasa en cada push
# y PR, que ahí es gratis. El privado gasta minutos de pago: solo con cada
# etiqueta de versión v* (la sube release.sh) o a mano. Mismo fichero en los dos.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.private && github.ref_type == 'tag') ||
      (!github.event.repository.private && github.ref_type != 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Los tests simulan un móvil en España (Europe/Madrid); los runners usan UTC por defecto.
      TZ: Europe/Madrid
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # Los ficheros generados (*.g.dart, *.freezed.dart, drift) y firebase_options.dart están versionados: sin paso de codegen.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  content:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.repository.private && github.ref_type == 'tag') ||
      (!github.event.repository.private && github.ref_type != 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # pdftotext (poppler) lo usa el extractor de preguntas.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tool/content/requirements.txt
      - run: pip install -r tool/content/requirements.txt
      - run: python -m pytest tool/content/tests
